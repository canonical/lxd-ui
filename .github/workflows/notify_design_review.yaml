name: Notify design review

on:
  pull_request_target:
    types: [labeled]

jobs:
  notifyDesignReview:
    if: >-
      github.event.label.name == 'Review: Design needed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: '@sophiecarroll Design review is needed for this PR.'
            });
